# PaperMate 反向代理配置
#
# 用法：
#   1. 改掉 server_name 和证书路径
#   2. cp deploy/nginx.conf /etc/nginx/conf.d/papermate.conf
#   3. nginx -t && systemctl reload nginx
#
# 这份配置里每一行都有具体原因，别随手删——尤其是三处标了「必需」的。

upstream papermate_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name papermate.example.com;
    # 申请证书时保留这段，certbot 需要走 HTTP 校验
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name papermate.example.com;

    ssl_certificate     /etc/letsencrypt/live/papermate.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/papermate.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 【必需】上传上限。一篇论文 PDF 常见 20-50MB，默认 1M 会直接 413，
    # 而前端拿到的是 HTML 错误页，只会显示「请求失败」。
    client_max_body_size 100m;
    # 大文件上传在慢网络上可能要几分钟，默认 60s 会超时断开
    client_body_timeout 300s;

    # 反向代理基本头
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # 【必需】LLM 生成很慢。一键成稿单步可能跑 10 分钟以上，
    # 默认 60s 会让 Nginx 先断，用户看到 504 而任务其实还在后台跑，
    # 之后再刷新状态又会「突然出现」——非常难解释。
    proxy_read_timeout  1800s;
    proxy_send_timeout  1800s;
    proxy_connect_timeout 30s;

    # 【必需】别缓冲。轮询状态接口返回小 JSON 无所谓，但一旦将来加 SSE
    # 流式输出，缓冲会让前端一个字都收不到直到结束。
    proxy_buffering off;

    location / {
        proxy_pass http://papermate_backend;
    }

    # 检索缓存/会话目录绝不能被直接访问（虽然不在 static 下，双保险）
    location ~ ^/(data|_oneshot|_sessions|cache|uploads)/ {
        return 404;
    }

    access_log /var/log/nginx/papermate.access.log;
    error_log  /var/log/nginx/papermate.error.log;
}
