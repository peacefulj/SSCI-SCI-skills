# 目标期刊 / 会议清单（选题环节「下拉」数据源）
#
# 排序约定（v1.1.0 起）：**英文国际刊/会在前，中文刊在后**。
# 本工具的规则库基于国际期刊规范（IMRaD + 英文写作惯例），默认产出英文稿，
# 因此下拉先给英文目标；中文刊保留在每组末尾并标注「中文稿」，方便确有中文投稿需求时选用。
# 标注为通用参考口径（FT50 / ABS / JCR / CCF），投稿前请以最新官方分区与作者指南为准。

