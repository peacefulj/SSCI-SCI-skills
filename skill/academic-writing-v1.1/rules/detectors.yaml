    track: ei-conf
    kind: require_when
    severity: should
    when: ["min-?max", "z-?score", "feature scaling", "normaliz(e|ed|ation) (the )?(feature|signal|amplitude)", "标准化", "归一化"]
    not_when: ["batch normaliz", "layer normaliz", "\\bBN\\b", "group normaliz"]
    patterns: ["training (set|data|fold) only", "fitted on the training", "on the training set", "仅(在)?训练集", "训练集(内|上)"]

  - id: ENG-DAT-002
