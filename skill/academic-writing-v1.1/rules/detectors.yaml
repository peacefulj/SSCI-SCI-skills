  # ---- v1.2.0：4 本欠梳理书目的新增检测器 ----
  - id: QNT-MM-001
    track: quant
    kind: require_when
    severity: should
    when: ["randomly assigned", "random(ized|ly) (assign|allocat)", "randomi[sz]ed (trial|experiment|controlled)", "随机(分组|分配|对照)"]
    patterns: ["balanc", "attrition", "baseline", "平衡", "流失"]

  - id: QNT-MM-003
    track: quant
    kind: forbid
    severity: should
    patterns: ["(individual|student|firm|household|worker|patient|teacher)[^.]{0,60}(would|will) (gain|improve|increase|earn|benefit)"]

  - id: QNT-MM-005
    track: quant
    kind: require_when
    severity: should
    when: ["regression discontinuity", "断点回归", "(?-i:\\bRDD?\\b)", "running variable", "forcing variable"]
    patterns: ["(figure|fig\\.|plot|graph)[^.]{0,80}(running|forcing|threshold|cutoff|assignment|score)", "binscatter", "scatter", "散点", "断点图"]

  - id: QNT-CFT-003
    track: quant
    kind: require_when
    severity: should
    when: ["(two-way|individual|firm|unit|entity|city|county|state|district|school)[- ]fixed effect", "two-way fixed effects", "within (estimator|transformation)", "固定效应模型", "个体固定效应", "双向固定效应"]
    patterns: ["time-?varying (confound|omitted|unobserved|shock)", "cannot (rule out|eliminate|absorb)", "does not (eliminate|address|absorb)", "remaining (bias|confounding)", "时变(混杂|遗漏)", "残余(偏误|混杂)", "无法消除"]

  - id: QNT-REG-001
    track: quant
    kind: forbid
    severity: should
    patterns: ["coefficient[^.]{0,80}(is|represents?|captures?|corresponds? to) the effect"]

  - id: QNT-REG-002
    track: quant
    kind: forbid_when
    severity: should
    when: ["significant", "显著性"]
    patterns: ["significant[^.]{0,60}(large|substantial|important|meaningful)", "显著[^。]{0,20}(很大|重大|重要)"]

  - id: QNT-REG-003
    track: quant
    kind: require_when
    severity: should
    when: ["(?-i:\\bR2\\b)", "R-squared", "R²", "(?-i:\\bOLS\\b)"]
    not_when: ["propensity score", "psmatch", "倾向得分", "nearest neighbo"]
    patterns: ["residual", "diagnostic", "posterior predictive", "model (fit|check)", "goodness-of-fit", "残差", "拟合(优度|诊断)"]

  - id: QNT-REG-004
    track: quant
    kind: require_when
    severity: should
    when: ["interaction term", "interaction effect", "交互项", "moderat(ion|ing) (effect|analysis)"]
    not_when: ["difference-in-difference", "diff-in-diff", "two-way fixed effect", "双重差分"]
    patterns: ["simple slope", "marginal effect", "average marginal", "(interaction|moderation) (plot|figure|graph)", "(plot|figure)[^.]{0,60}(interaction|moderat)", "简单斜率", "分层(效应|分析)"]

  - id: QNT-WHY-002
    track: quant
    kind: require_when
    severity: should
    when: ["works? through", "operates? (through|via)", "the mechanism (is|lies)", "channel through which", "机制在于"]
    patterns: ["mediat", "direct (effect|path)", "indirect (effect|path)", "decompos", "中介"]

